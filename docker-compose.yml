version: '3.9'

services:
  pyauthservice:
    image: ghcr.io/ankithsajikumar/pyauthservice:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pyauthservice
    ports:
      - "8000:8000"
    volumes:
      - /var/apps/auth/db/db.sqlite3:/app/db.sqlite3
    environment:
      - SECRET_KEY=dev-secret-key-change-in-production
      - SERVICE_API_TOKEN=dev-token-change-in-production
      - DEBUG=False
    entrypoint: /app/entrypoint.sh
    command: gunicorn pyauthservice.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120
