version: '3.9'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: pyauthservice-db
    environment:
      - POSTGRES_DB=pyauthservice
      - POSTGRES_USER=authuser
      - POSTGRES_PASSWORD=authpassword
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authuser -d pyauthservice"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pyauthservice-network

  # Django OAuth2/JWT Authentication Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pyauthservice-app
    ports:
      - "8000:8000"
    volumes:
      - .:/app  # Mount source code for hot reload (development)
      - /app/__pycache__  # Exclude __pycache__ from mount
    environment:
      - DEBUG=True
      - SECRET_KEY=dev-secret-key-change-in-production
      - SERVICE_API_TOKEN=dev-token-change-in-production
      - DATABASE_URL=postgresql://authuser:authpassword@db:5432/pyauthservice
      - DB_HOST=db
      - DB_PORT=5432
      - ALLOWED_HOSTS=localhost,127.0.0.1,app
    depends_on:
      db:
        condition: service_healthy
    entrypoint: /app/entrypoint.sh
    command: gunicorn pyauthservice.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120
    networks:
      - pyauthservice-network

  # Redis Cache (optional, for session/token caching)
  cache:
    image: redis:7-alpine
    container_name: pyauthservice-cache
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pyauthservice-network

volumes:
  postgres-data:

networks:
  pyauthservice-network:
    driver: bridge
