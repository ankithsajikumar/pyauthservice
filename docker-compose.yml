services:
  pyauthservice:
    image: ${FULL_IMAGE:-pyauthservice}:${IMAGE_TAG:-latest}
    user: "1000:1000"
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pyauthservice
    restart: unless-stopped
    ports:
      - "${PORT:-8000:8000}"
    volumes:
      - ./staticfiles:/app/staticfiles
    environment:
      DB_ENGINE: postgresql
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    entrypoint: /app/entrypoint.sh
    command: gunicorn pyauthservice.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120 --access-logfile - --error-logfile -

  db:
    image: postgres:16-alpine
    container_name: pyauthservice-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pyauthservice}
      POSTGRES_USER: ${POSTGRES_USER:-authuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-authpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: